<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Stop Service NHSO - Bamrasnaradura</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            min-height: 100vh;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px 0 rgba(0, 105, 92, 0.15);
            padding: 40px 30px;
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        
        /* สไตล์ปุ่มกด */
        .btn-mint {
            background-color: #4db6ac;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(77, 182, 172, 0.2);
        }
        .btn-mint:hover {
            background-color: #26a69a;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(77, 182, 172, 0.4);
        }

        /* ปุ่ม Admin โหมด */
        .admin-controls { display: none; gap: 5px; margin-left: auto; }
        .is-admin .admin-controls { display: flex; }
        .btn-admin-toggle {
            position: absolute; top: 20px; right: 20px; 
            background: none; border: none; color: #00796b; opacity: 0.3;
            transition: all 0.3s ease;
        }
        .btn-admin-toggle:hover { opacity: 1; transform: rotate(90deg); }

        /* แอนิเมชันไอคอนน่ารักๆ */
        .cute-icon-wrapper {
            display: inline-block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite; /* เคลื่อนไหวลอยขึ้นลง */
        }
        .cute-icon {
            font-size: 3.5rem;
            color: #00796b;
            position: relative;
        }
        .cute-heart {
            font-size: 1.5rem;
            color: #ff5252;
            position: absolute;
            top: -5px;
            right: -10px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="glass-card text-center" id="main-card">
        <!-- ปุ่มเฟืองเปิดโหมด Admin (ซ่อนอยู่มุมขวาบน) -->
        <button class="btn-admin-toggle" onclick="toggleAdmin()">
            <i class="fas fa-cog fa-lg"></i>
        </button>

        <!-- ส่วนหัว (Header) พร้อมไอคอนดุ๊กดิ๊กและซับไตเติล -->
        <div class="header-section mb-4">
            <div class="cute-icon-wrapper">
                <div class="cute-icon">
                    <i class="fas fa-hospital-user"></i>
                    <i class="fas fa-heart fa-beat cute-heart"></i> <!-- ไอคอนหัวใจเต้น -->
                </div>
            </div>
            <h3 style="color: #00695c; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px;">
                One Stop Service NHSO
            </h3>
            <p style="color: #00897b; font-size: 1rem; margin-bottom: 0; font-weight: 500;">
                หน่วยไตเทียม สถาบันบำราศนราดูร
            </p>
        </div>
        
        <!-- ปุ่มสำหรับเพิ่มลิงก์ (แสดงเฉพาะตอนเปิด Admin Mode) -->
        <div id="add-btn-container" style="display: none;" class="mb-4">
            <button class="btn btn-outline-success w-100" style="border-radius: 12px; border-width: 2px;" onclick="showForm('add')">
                <i class="fas fa-plus me-2"></i>เพิ่มลิงก์ใหม่
            </button>
        </div>

        <!-- คอนเทนเนอร์สำหรับใส่ปุ่มลิงก์ -->
        <div id="button-container">
            <div class="spinner-grow text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        // เอาลิงก์ Web App จาก Google Apps Script (เวอร์ชันล่าสุด) มาใส่ที่นี่
        const GAS_URL = 'https://script.google.com/macros/s/AKfycby87kab_L3_Oo14Pa9RQS9PnqfhwPgGCZQCZzilyGTdZHkdiQa2hRpqoNbupbzpQNSd/exec';
        let isAdmin = false;
        let currentLinks = [];

        function toggleAdmin() {
            isAdmin = !isAdmin;
            document.getElementById('main-card').classList.toggle('is-admin', isAdmin);
            document.getElementById('add-btn-container').style.display = isAdmin ? 'block' : 'none';
        }

        async function fetchLinks() {
            try {
                const res = await fetch(GAS_URL);
                currentLinks = await res.json();
                renderLinks();
            } catch (err) {
                document.getElementById('button-container').innerHTML = `<div class="alert alert-danger" style="border-radius: 12px;">โหลดข้อมูลล้มเหลว กรุณารีเฟรชหน้าเว็บ</div>`;
            }
        }

        function renderLinks() {
            const container = document.getElementById('button-container');
            container.innerHTML = '';
            
            currentLinks.forEach((link) => {
                const div = document.createElement('div');
                div.className = 'd-flex align-items-center w-100';
                
                div.innerHTML = `
                    <a href="${link.url}" target="_blank" class="btn btn-mint flex-grow-1 text-start">
                        <i class="${link.icon} fa-fw" style="font-size: 1.3rem;"></i>
                        <span>${link.name}</span>
                    </a>
                    <div class="admin-controls mb-3">
                        <button class="btn btn-warning btn-sm ms-2" style="border-radius: 8px;" onclick="showForm('update', '${link.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm" style="border-radius: 8px;" onclick="deleteLink('${link.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function showForm(action, id = null) {
            let targetLink = id ? currentLinks.find(l => l.id == id) : { name: '', url: '', icon: 'fas fa-link' };
            
            Swal.fire({
                title: action === 'add' ? '✨ เพิ่มลิงก์ใหม่' : '✏️ แก้ไขลิงก์',
                html: `
                    <input id="swal-name" class="swal2-input" placeholder="ชื่อระบบ (เช่น โปรแกรม e-Claim)" value="${targetLink.name}">
                    <input id="swal-url" class="swal2-input" placeholder="URL ลิงก์ (ต้องมี https://)" value="${targetLink.url}">
                    <input id="swal-icon" class="swal2-input" placeholder="ไอคอน (เช่น fas fa-desktop)" value="${targetLink.icon}">
                    <div class="mt-2 text-start" style="font-size: 0.8rem; color: #666;">
                        * ดูชื่อไอคอนได้ที่เว็บ Font Awesome (Free)
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#4db6ac',
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    return {
                        action: action,
                        id: id,
                        name: document.getElementById('swal-name').value,
                        url: document.getElementById('swal-url').value,
                        icon: document.getElementById('swal-icon').value
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) submitData(result.value);
            });
        }

        function deleteLink(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ลบแล้วจะไม่สามารถกู้คืนได้นะ!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#b0bec5',
                confirmButtonText: 'ใช่, ลบเลย!'
            }).then((result) => {
                if (result.isConfirmed) submitData({ action: 'delete', id: id });
            });
        }

        async function submitData(payload) {
            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                await fetchLinks();
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1500, showConfirmButton: false });
            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
            }
        }

        window.onload = fetchLinks;
    </script>
</body>
</html>
